name: Enterprise quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: enterprise-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen --extra api --extra dev --extra gcp --extra analysis
      - run: .venv/bin/ruff check platform_api platform_tests scripts/benchmark_e2e.py
      - run: .venv/bin/ruff format --check platform_api platform_tests scripts/benchmark_e2e.py
      - run: .venv/bin/mypy platform_api
      - run: .venv/bin/coverage run -m pytest -q
      - run: .venv/bin/coverage report --fail-under=90
      - run: .venv/bin/python scripts/check_examples.py
      - run: .venv/bin/python -m scripts.export_openapi --check
      - run: .venv/bin/pip-audit --require-hashes -r requirements-api.lock --format json --output python-audit.json
      - run: .venv/bin/cyclonedx-py requirements requirements-api.lock --output-file sbom-python.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-security
          path: |
            python-audit.json
            sbom-python.json
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen --extra api
        working-directory: .
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=critical
      - run: npm sbom --sbom-format cyclonedx > sbom-node.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/sbom-node.json
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with: {terraform_version: '1.17.1', terraform_wrapper: false}
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate -json > terraform-validation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: terraform-validation
          include-hidden-files: true
          path: |
            terraform-validation.json
            infra/.terraform.lock.hcl
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - run: docker build --build-arg VCS_REF=${{ github.sha }} -t otm-guard:ci .
      - run: |
          docker run --name otm-guard -d -p 127.0.0.1:8080:8080 -e OTM_ENV=demo otm-guard:ci
          python scripts/container_smoke.py
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: otm-guard:ci
          format: json
          output: trivy-image.json
          severity: CRITICAL
          exit-code: '1'
      - run: docker logs otm-guard
        if: failure()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: container-security, path: trivy-image.json}
